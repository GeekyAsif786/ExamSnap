name: Bug report
description: Something in the app doesn't work.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        **Please don't attach personal photos or signatures.** Issues are public. If an image is needed to reproduce the bug, use a picture of an object or a test image instead.

        If a portal rejected a file, use the "Wrong spec" form instead. Security problems go to the [security policy](https://github.com/GeekyAsif786/ExamSnap/security/policy), not here.
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: e.g. Redmi Note 12, Windows 11 laptop, iPhone 14
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Chrome 131, Safari 18, Firefox 133
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Choose SSC → Photograph
        2. Upload a PNG screenshot
        3. Press "Make my file"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
