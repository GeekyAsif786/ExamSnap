# Auto-generated release notes (Releases → Draft → "Generate release notes").
# A PR lands in the first category whose labels it has. GitHub lists
# first-time contributors on its own. "Other changes" ("*") must stay the
# final entry: GitHub matches "*" only against PRs no earlier category
# took, so Dependencies is the last real category, just above it.
changelog:
  exclude:
    labels: [duplicate, wontfix]
  categories:
    - title: Fixes
      labels: [bug]
    - title: New exams
      labels: [preset]
    - title: Features
      labels: [enhancement]
    - title: Translations
      labels: [i18n]
    - title: Docs
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
