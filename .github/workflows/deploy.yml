name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Served at the root of the custom domain. Repository variables can
      # override these (e.g. BASE_PATH=/ExamSnap/ for a project-site URL).
      # Pages deploys via Actions don't need a CNAME file: the custom domain
      # is set in the repository's Pages settings instead.
      BASE_PATH: ${{ vars.BASE_PATH || '/' }}
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://examsnap.asifurrahaman.com' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # Runs only if every test step above passed.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
