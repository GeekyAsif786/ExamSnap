name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; the deploy job alone gets Pages + OIDC.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only main ever deploys, even for a manual run started on another branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Served at the root of the custom domain. Repository variables can
      # override these (e.g. BASE_PATH=/ExamSnap/ for a project-site URL).
      # Pages deploys via Actions don't need a CNAME file: the custom domain
      # is set in the repository's Pages settings instead.
      BASE_PATH: ${{ vars.BASE_PATH || '/' }}
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://examsnap.asifurrahaman.com' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # No step needs npm install scripts.
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    # Runs only if every test step above passed.
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
