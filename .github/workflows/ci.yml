name: CI

# Triggers stay push and pull_request. Never use pull_request_target: it
# runs with the base repository's secrets and a write-capable token while a
# forked PR controls the code being checked out, so a malicious fork could
# steal the token or push to the repo. Everything here is read-only; the
# preset table goes to the job summary instead of a bot comment for the
# same reason.
on:
  push:
  pull_request:

# Least privilege: read the code, nothing else.
permissions:
  contents: read

# Actions are pinned to full commit SHAs (version in the comment);
# Dependabot keeps both up to date. No step needs npm install scripts:
# Playwright browsers come from `npx playwright install`, not postinstall.

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the preset summary can diff against the base branch.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Runtime dependencies only (there are none). Dev-only advisories,
      # such as the known minimatch one, don't ship and don't fail CI.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run check
      - run: npm test
      # Every preset × document, with the ones this PR changes listed first.
      # base_ref comes in through env, never interpolated into the script.
      - name: Preset summary
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: node scripts/preset-summary.mjs --base "origin/$BASE_REF" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps
      - run: npm run test:e2e
      # Review screenshots are not committed; attach them to every PR.
      - run: npm run screenshots
        if: github.event_name == 'pull_request'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request'
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
